<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3B1F3A">
  <title>La búsqueda de Paulina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de inicio -->
  <section id="intro" class="screen screen--intro">
    <div class="intro__inner">
      <p class="intro__hand">Hoy es tu día</p>
      <h1 class="intro__title">Feliz cumpleaños, <span id="introName">Paulina</span></h1>
      <p class="intro__text">Escondí pequeños regalos por la casa. Cada uno trae una palabra secreta y cada palabra te da una letra. Junta todas las letras y se abre la sorpresa final.</p>
      <button id="startBtn" class="btn btn--big">Empezar la búsqueda</button>
    </div>
  </section>

  <!-- Juego -->
  <main id="game" class="screen screen--game" hidden>
    <header class="top">
      <div class="letters" id="letters" aria-label="Letras encontradas"></div>
      <p class="progress" id="progressText"></p>
    </header>

    <div class="map-wrap">
      <svg id="map" viewBox="0 0 360 520" role="img" aria-label="Mapa de la casa">
        <defs>
          <pattern id="floor" width="12" height="12" patternUnits="userSpaceOnUse">
            <path d="M0 12 L12 0" stroke="var(--ink)" stroke-opacity=".06" stroke-width="1"/>
          </pattern>
        </defs>

        <!-- Habitaciones -->
        <g class="rooms">
          <rect x="10" y="10" width="190" height="250" class="room"/>
          <rect x="200" y="10" width="150" height="250" class="room room--alt"/>
          <rect x="10" y="270" width="180" height="200" class="room room--alt"/>
          <rect x="200" y="270" width="60" height="240" class="room"/>
          <rect x="260" y="270" width="90" height="140" class="room room--alt"/>
        </g>

        <!-- Muebles -->
        <g class="furniture">
          <!-- Sofá en L -->
          <path d="M20 20 H150 V46 H46 V170 H20 Z" class="piece piece--sofa"/>
          <!-- Alfombra y mesa de centro -->
          <rect x="60" y="92" width="110" height="90" rx="3" class="rug"/>
          <rect x="72" y="112" width="74" height="44" rx="4" class="piece"/>
          <!-- Lámpara -->
          <circle cx="178" cy="34" r="10" class="piece"/>
          <!-- Mueble TV -->
          <rect x="58" y="236" width="124" height="18" rx="2" class="piece piece--tv"/>
          <rect x="80" y="230" width="80" height="4" rx="1" class="tv-screen"/>

          <!-- Comedor -->
          <circle cx="268" cy="125" r="36" class="piece"/>
          <circle cx="228" cy="125" r="8" class="chair"/>
          <circle cx="308" cy="125" r="8" class="chair"/>
          <circle cx="268" cy="84" r="8" class="chair"/>
          <circle cx="268" cy="166" r="8" class="chair"/>
          <rect x="300" y="18" width="42" height="24" rx="2" class="piece"/>
          <rect x="326" y="70" width="18" height="180" rx="2" class="piece"/>
          <line x1="215" y1="12" x2="295" y2="12" class="window"/>
          <line x1="40" y1="12" x2="150" y2="12" class="window"/>

          <!-- Escalera -->
          <g class="stairs">
            <line x1="30" y1="300" x2="170" y2="300"/>
            <line x1="30" y1="325" x2="170" y2="325"/>
            <line x1="30" y1="350" x2="170" y2="350"/>
            <line x1="30" y1="375" x2="170" y2="375"/>
            <line x1="30" y1="400" x2="170" y2="400"/>
            <line x1="30" y1="425" x2="170" y2="425"/>
            <line x1="30" y1="450" x2="170" y2="450"/>
          </g>

          <!-- Cuadro de fotos del pasillo -->
          <rect x="253" y="330" width="5" height="60" class="frame"/>
          <!-- Puerta de entrada -->
          <path d="M205 510 A 45 45 0 0 1 250 465" class="door"/>
        </g>

        <!-- Nombres de las zonas -->
        <g class="labels">
          <text x="105" y="210">sala</text>
          <text x="275" y="215">comedor</text>
          <text x="100" y="490">escalera</text>
          <text x="305" y="345">cocina</text>
          <text x="230" y="300" transform="rotate(-90 230 300)">pasillo</text>
          <text x="300" y="500" class="small">← entrada</text>
        </g>

        <!-- Pines (los dibuja script.js) -->
        <g id="pins"></g>
      </svg>
    </div>

    <!-- Tarjeta de la pista actual -->
    <section class="clue" id="clueCard" aria-live="polite">
      <p class="clue__step" id="clueStep"></p>
      <h2 class="clue__title" id="clueTitle"></h2>
      <p class="clue__text" id="clueText"></p>
      <p class="clue__help" id="clueHelp" hidden></p>

      <form class="code" id="codeForm" autocomplete="off">
        <label for="codeInput" class="code__label">Palabra secreta de la tarjeta</label>
        <div class="code__row">
          <input id="codeInput" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="Escríbela aquí">
          <button type="submit" class="btn">Abrir</button>
        </div>
        <p class="code__error" id="codeError" role="alert"></p>
      </form>

      <button type="button" class="link" id="helpBtn">Necesito una ayudita</button>
    </section>

    <footer class="foot">
      <button type="button" class="link link--quiet" id="resetBtn">Reiniciar juego</button>
    </footer>
  </main>

  <!-- Ventana de hallazgo -->
  <div class="modal" id="foundModal" hidden>
    <div class="modal__card">
      <div class="modal__letter" id="foundLetter"></div>
      <h3 class="modal__title" id="foundTitle"></h3>
      <p class="modal__text" id="foundText"></p>
      <button class="btn" id="foundNext">Siguiente pista</button>
    </div>
  </div>

  <!-- Final -->
  <section id="finale" class="screen screen--finale" hidden>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div class="finale__inner">
      <div class="finale__name" id="finaleName"></div>
      <h2 class="finale__title">¡Lo lograste!</h2>
      <p class="finale__hand" id="finaleLetter"></p>
      <p class="finale__go">Ahora ve al mueble que está bajo el televisor. Ahí te espera tu regalo.</p>
      <button class="btn btn--big" id="mapBtn">Ver el mapa</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
